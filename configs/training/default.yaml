# Default Training Configuration
defaults:
  - ../data/brats
  - _self_

training:
  model: unet
  epochs: 100
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 4
  device: cuda
  mixed_precision: true
  torch_compile: false
  gradient_clip: 1.0
  early_stopping_patience: 15
  save_top_k: 3
  checkpoint_dir: ./data/models/checkpoints
  seed: 42

optimizer:
  name: adamw
  params:
    lr: ${training.learning_rate}
    weight_decay: ${training.weight_decay}

scheduler:
  name: cosine
  params:
    T_max: ${training.epochs}
    eta_min: 1.0e-6

loss:
  name: dice_ce
  params:
    dice_weight: 0.5
    ce_weight: 0.5

evaluation:
  metrics:
    - dice
    - iou
    - precision
    - recall
    - sensitivity
    - specificity
    - hausdorff
  save_confusion_matrix: true
  save_roc_curve: true

mlflow:
  experiment_name: medvision-brain-tumor
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,http://localhost:5000}
  log_model: true
  log_artifacts: true

optuna:
  enabled: false
  n_trials: 50
  search_space:
    learning_rate: [1.0e-5, 1.0e-2]
    batch_size: [2, 8]
    dropout: [0.0, 0.5]

ensemble:
  enabled: false
  strategy: weighted_average
  models: []
