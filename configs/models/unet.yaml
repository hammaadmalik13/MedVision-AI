# U-Net Model Configuration
model:
  name: unet
  in_channels: 4
  out_channels: 4
  spatial_dims: 3
  features: [32, 64, 128, 256, 512]
  dropout: 0.1
  norm: instance
  activation: relu
  deep_supervision: false

inference:
  batch_size: 1
  sliding_window: true
  overlap: 0.5
  use_amp: true

export:
  onnx: true
  opset_version: 17
