[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medvision-ai"
version = "1.0.0"
description = "Production-Grade Brain Tumor MRI Segmentation Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "MedVision AI Team" }]
keywords = ["medical-imaging", "segmentation", "brain-tumor", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "boto3>=1.35.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "monai>=1.4.0",
    "nibabel>=5.3.0",
    "opencv-python-headless>=4.10.0",
    "albumentations>=1.4.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "scikit-image>=0.24.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "vtk>=9.3.0",
    "mlflow>=2.18.0",
    "dvc[s3]>=3.56.0",
    "optuna>=4.1.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "chromadb>=0.5.0",
    "faiss-cpu>=1.9.0",
    "pypdf>=5.1.0",
    "reportlab>=4.2.0",
    "streamlit>=1.40.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "einops>=0.8.0",
    "timm>=1.0.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "grad-cam>=1.5.0",
    "medpy>=0.5.0",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.67.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "faker>=33.0.0",
]
gpu = [
    "onnxruntime-gpu>=1.20.0",
]

[project.scripts]
medvision-api = "medvision.presentation.api.main:run_server"
medvision-train = "training.scripts.train:main"
medvision-infer = "training.scripts.infer:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["medvision*", "training*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/medvision --cov=training --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/medvision", "training"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
